services:
  tianming-web:
    container_name: tianming-web
    build:
      context: ../..
      dockerfile: web/docker/Dockerfile
    image: tianming-web:0.1
    ports:
      - "38721:38721"
    volumes:
      - ./data/Storage:/app/Storage
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:38721
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:38721/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
